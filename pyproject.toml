[project]
name = "yline"
version = "0.1.0"
description = "Multi-agent lyric video pipeline — song name in, synced lyric video out"
readme = "README.md"
authors = [
    { name = "pjpangilinan", email = "patrickjpangilinan@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM provider
    "groq>=0.30.0,<1.0.0",
    # Video assembly
    "moviepy>=2.0.0",
    # Audio download
    "yt-dlp>=2024.0.0",
    # Lyrics
    "lyricsgenius>=3.0.0",
    # HTTP & parsing
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # Data models
    "pydantic>=2.0.0",
    # Tracing
    "langsmith>=0.1.0",
    # Image processing
    "pillow>=10.0.0",
    # Environment
    "python-dotenv>=1.0.0",
]

[project.scripts]
yline = "yline.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
